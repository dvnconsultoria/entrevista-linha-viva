<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F7194">
<link rel="icon" href="img/old-mark.png">
<title>Auto Avaliação · Líder Padrão Goiás</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one-screen app — old educação brand bar, interviewer strip, chat column, answer dock pinned to the bottom */
:root{
  --bg:#F5F7F9; --surface:#FFFFFF; --sunk:#EBF0F3; --ink:#1D2226; --gray:#616161; --muted:#687177; --line:#D8E0E5;
  --brand:#58A1C1; --brand-strong:#2F7194; --brand-soft:#E2F0F6; --on-brand:#FFFFFF; --danger:#B3261E;
  --c-t:#3A8FC0; --c-p:#C9772E; --warn:#9A5B00; --warn-soft:#FBEBD3; --grid:#E3E9ED;
  --display:"Jost","Futura","Century Gothic",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121518; --surface:#1A1F23; --sunk:#232A2F; --ink:#ECEFF1; --gray:#B9BEC2; --muted:#9AA3A9; --line:#2E363C;
  --brand:#6DB3D1; --brand-strong:#58A1C1; --brand-soft:#1B3340; --on-brand:#0B171D; --danger:#F2B8B5; --warn:#F2B84B; --warn-soft:#3A2B12; --grid:#2A3238; color-scheme:dark}
  :root:not([data-theme="light"]) .lg-l{display:none} :root:not([data-theme="light"]) .lg-d{display:block}}
:root[data-theme="dark"]{
  --bg:#121518; --surface:#1A1F23; --sunk:#232A2F; --ink:#ECEFF1; --gray:#B9BEC2; --muted:#9AA3A9; --line:#2E363C;
  --brand:#6DB3D1; --brand-strong:#58A1C1; --brand-soft:#1B3340; --on-brand:#0B171D; --danger:#F2B8B5; --warn:#F2B84B; --warn-soft:#3A2B12; --grid:#2A3238; color-scheme:dark}
:root[data-theme="dark"] .lg-l{display:none} :root[data-theme="dark"] .lg-d{display:block}
.lg-d{display:none}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:780px;margin:0 auto}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* brand bar */
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brandbar img{height:28px;width:auto}
.hbtns{display:flex;gap:6px;flex:none}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;display:flex;gap:6px;align-items:center}
.iconbtn[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--ink)}

/* interviewer */
.who{display:flex;gap:12px;align-items:center;padding-block:12px 4px}
.avatar{position:relative;flex:none;width:52px;height:52px;border-radius:50%;background:var(--surface);border:2px solid var(--brand);display:grid;place-items:center}
.avatar img{width:26px;height:auto}
.avatar::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--brand);opacity:0}
.avatar.talking::after{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%{opacity:.8;inset:-4px}100%{opacity:0;inset:-12px}}
.who b{display:block;font:600 1.2rem/1.1 var(--display);color:var(--ink)}
.who span{color:var(--muted);font-size:.88rem}
.video{margin-top:8px;border-radius:14px;overflow:hidden;background:var(--ink);max-width:100%}
.video video{display:block;width:100%;max-height:34vh}

.progress{display:flex;gap:4px;padding-block:8px 2px}
.seg{flex:1;min-width:0}
.seg i{display:block;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.seg i b{display:block;height:100%;width:0;background:var(--brand);transition:width .4s}
.seg small{display:block;margin-top:5px;font:500 .7rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.on small{color:var(--brand-strong)}

/* chat */
#chat{flex:1;overflow-y:auto;padding-block:16px 24px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:min(85%,560px);padding:10px 14px;border-radius:16px;animation:in .25s ease-out;overflow-wrap:anywhere}
@keyframes in{from{transform:translateY(6px);opacity:.4}}
.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.me{align-self:flex-end;background:var(--brand-strong);color:var(--on-brand);border-bottom-right-radius:4px}
.typing{display:flex;gap:4px;padding:14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--brand);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-4px);opacity:.4}}
.mod-tag{display:inline-block;font:500 .74rem/1 var(--mono);background:var(--brand-soft);color:var(--brand-strong);padding:4px 7px;border-radius:4px;margin-bottom:6px}

/* welcome */
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.welcome .eyebrow{font:600 .78rem/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--brand-strong)}
.welcome h1{margin:0;font:600 clamp(1.9rem,6.5vw,2.5rem)/1.05 var(--display);text-wrap:balance}
.welcome p{margin:0;color:var(--muted);max-width:54ch}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{font-size:.86rem;background:var(--sunk);color:var(--gray);padding:5px 10px;border-radius:999px}
.primary{background:var(--brand-strong);color:var(--on-brand);border:0;border-radius:12px;padding:13px 20px;font:600 1rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;align-self:flex-start}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}

/* cards inside chat */
.card{align-self:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;animation:in .25s ease-out}
.card h3{margin:0;font:600 1.1rem/1.2 var(--display)}
.legend{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:.96rem}
.legend b{font:600 .95rem/1 var(--mono);width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--brand-soft);color:var(--brand-strong)}
.legend b.top{background:var(--brand-strong);color:var(--on-brand)}
.legend .lv{display:flex;flex-direction:column;gap:4px;min-width:0}
.legend .lv i{display:block;height:6px;border-radius:3px;background:var(--brand)}
.legend small{font:600 .68rem/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.legcap{display:flex;justify-content:space-between;gap:8px;font:600 .72rem/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px}

/* ratings: Teoria / Prática headed above each scale */
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) auto auto;column-gap:18px}
.rhead{display:contents}
.rhead>div{position:sticky;top:-16px;z-index:2;background:var(--surface);padding:8px 0 8px;border-bottom:2px solid var(--brand);font:600 .78rem/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rhead .col{color:var(--brand-strong);text-align:center}
.rhead .col small{display:block;margin-top:4px;font:500 .68rem/1 var(--mono);letter-spacing:.12em;color:var(--muted)}
.ritem{display:contents}
.ritem>*{padding:10px 0;border-bottom:1px solid var(--line)}
.ritem p{margin:0;font-size:.96rem;min-width:0;align-self:stretch;display:flex;gap:8px;align-items:center}
.ritem p em{font:500 .78rem var(--mono);color:var(--muted);font-style:normal;flex:none}
.scale{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.scale>span{display:none;font:600 .72rem/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--brand-strong)}
.scale .btns{display:flex;gap:4px}
.scale button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font:500 .92rem/1 var(--mono)}
.scale button:hover{border-color:var(--brand)}
.scale button[aria-pressed="true"]{background:var(--brand-strong);color:var(--on-brand);border-color:var(--brand-strong)}
.card.locked .scale button{pointer-events:none}
.card.locked .scale button:not([aria-pressed="true"]){opacity:.3}
.card .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:.86rem;color:var(--muted)}
@media (max-width:600px){
  .rgrid{grid-template-columns:1fr 1fr;column-gap:12px}
  .rhead{display:none}
  .ritem p{grid-column:1/-1;border-bottom:0;padding-bottom:4px}
  .ritem .scale{padding-top:4px}
  .scale>span{display:block}
}

canvas.sig{width:100%;height:160px;border:1.5px dashed var(--brand);border-radius:12px;background:var(--bg);touch-action:none}

.result{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 14px;align-items:center;font-size:.94rem}
.result .h{font:600 .72rem/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.result .n{font:500 .9rem var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.bar{height:6px;border-radius:3px;background:var(--sunk);grid-column:1/-1;overflow:hidden;margin-bottom:6px}
.bar b{display:block;height:100%;background:var(--brand)}
.ai{background:var(--brand-soft);border-radius:12px;padding:12px;font-size:.98rem;white-space:pre-wrap}

/* dock */
#dock{border-top:1px solid var(--line);background:var(--surface);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
#dock:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--brand);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:500}
.chip:hover{background:var(--brand-soft)}
.chip[aria-pressed="true"]{background:var(--brand-strong);border-color:var(--brand-strong);color:var(--on-brand)}
.chip.skip{border-color:var(--line);color:var(--muted)}
.inrow{display:flex;gap:8px}
.inrow input,.inrow textarea{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 13px;font:inherit}
.inrow textarea{resize:none;height:84px}
.send{flex:none;width:48px;border-radius:12px;border:0;background:var(--brand-strong);color:var(--on-brand);display:grid;place-items:center}
.dockfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:20px;flex-wrap:wrap}
.err{color:var(--danger);font-size:.86rem}
.link{background:none;border:0;padding:0;color:var(--muted);font-size:.86rem;text-decoration:underline}

/* panel */
#panel{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;padding-block:calc(16px + env(safe-area-inset-top,0px)) 24px}
.pin{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ptop{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.ptop img{height:26px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:600 .95rem var(--display);color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--brand)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 .72rem/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
.pill{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--gray)}
.pill.ok{background:var(--brand-soft);color:var(--brand-strong)}
.detail td{background:var(--bg);vertical-align:top}
.detail img{max-width:260px;background:#fff;border-radius:8px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.mediahelp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--muted);font-size:.94rem}
.mediahelp b{color:var(--ink)}
td .fala{max-width:52ch}
td .k{font:500 .76rem var(--mono);color:var(--muted)}
.mbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mbtns label,.mbtns button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.84rem;cursor:pointer;white-space:nowrap}
.mbtns label{border-color:var(--brand);color:var(--brand-strong)}
.mbtns input{display:none}
/* dashboard */
.dfilters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.dfilters label{display:flex;flex-direction:column;gap:4px;font:600 .7rem/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dfilters select{font:400 .95rem var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:150px}
.sample{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border-radius:12px;padding:10px 14px;font-size:.92rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi small{display:block;font:600 .7rem/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;margin-top:8px;font:600 1.9rem/1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{display:block;margin-top:6px;font-size:.84rem;color:var(--muted)}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.dcard h3{margin:0;font:600 1.15rem/1.2 var(--display)}
.dcard .sub{margin:-6px 0 0;color:var(--muted);font-size:.9rem}
.dgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
@media (max-width:860px){.dgrid{grid-template-columns:1fr}}
.legendrow{display:flex;gap:16px;font-size:.88rem;color:var(--muted)}
.legendrow i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw-t{background:var(--c-t)}.sw-p{background:var(--c-p)}
.bars{display:grid;grid-template-columns:minmax(110px,34%) minmax(0,1fr) auto;column-gap:12px;row-gap:0;align-items:center}
.bars .axis{grid-column:2;position:relative;height:16px;font:500 .72rem var(--mono);color:var(--muted)}
.bars .axis span{position:absolute;transform:translateX(-50%)}
.brow{display:contents}
.brow>*{padding-block:8px;border-top:1px solid var(--line)}
.blabel{font-size:.9rem;min-width:0}
.blabel em{font:500 .74rem var(--mono);font-style:normal;color:var(--muted);display:block}
.btrack{position:relative;display:flex;flex-direction:column;gap:2px;cursor:default;outline:none;border-radius:4px}
.btrack .gl{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.bar2{position:relative;height:11px;border-radius:0 4px 4px 0;min-width:2px}
.bar2.t{background:var(--c-t)}.bar2.p{background:var(--c-p)}
.bvals{font:500 .82rem var(--mono);font-variant-numeric:tabular-nums;text-align:right;line-height:13px;color:var(--ink)}
.bvals span{display:block}
.na{color:var(--muted);font-size:.85rem}
.btrack:hover .bar2,.btrack:focus .bar2{filter:brightness(1.1)}
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:.84rem;line-height:1.35;max-width:280px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#tip b{display:block;margin-bottom:2px}
.modchips{display:flex;flex-wrap:wrap;gap:6px}
.modchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font:500 .84rem var(--body)}
.modchips button[aria-pressed="true"]{background:var(--brand-strong);color:var(--on-brand);border-color:var(--brand-strong)}
.flag{display:inline-flex;gap:4px;align-items:center;font-size:.76rem;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:2px 8px;white-space:nowrap}
.mini{display:flex;flex-direction:column;gap:2px;min-width:110px}
.dtable{width:100%;min-width:560px}
.dtable td{vertical-align:middle}
.dempty{padding:26px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- Auto Avaliação Líder Padrão Goiás: ajustes ---- */
.rgrid{grid-template-columns:minmax(0,1fr) auto}
.ritem p span{display:flex;flex-direction:column;gap:2px}
.ritem p .pop{font:500 .72rem/1.2 var(--mono);color:var(--muted)}
.scale button{width:36px;height:36px}
.vfig{margin:0;display:flex;flex-direction:column;gap:6px}
.intro-video{width:100%;max-height:46vh;border-radius:14px;background:#0B171D;display:block}
.vfig figcaption{font-size:.86rem;color:var(--muted)}
.terms p{margin:0;color:var(--gray);font-size:.95rem}
.photorow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
img.face{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid var(--brand)}
.chip.was{background:var(--brand-soft)}
label.chip{cursor:pointer}
.card.locked .chips{display:none}
.who2{display:flex;gap:10px;align-items:center}
.thumb{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--sunk);display:inline-block;flex:none}
.bvals .hint{font-size:.72rem}
@media (max-width:600px){
  .rgrid{grid-template-columns:1fr}
  .ritem .scale{padding-top:2px;align-items:flex-start}
  .scale>span{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="brandbar gut">
    <img class="lg-l" src="img/old-light.png" alt="old educação">
    <img class="lg-d" src="img/old-dark.png" alt="old educação">
    <div class="hbtns">
      <button class="iconbtn" id="voiceBtn" aria-pressed="true" title="Ouvir as perguntas">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg><span>Som</span>
      </button>
    </div>
  </div>
  <div class="gut">
    <div class="who">
      <div class="avatar" id="avatar" aria-hidden="true"><img src="img/old-mark.png" alt=""></div>
      <div><b>Carlos</b><span>Instrutor · Líder Padrão Goiás · old educação</span></div>
    </div>
    <div class="progress" id="progress"></div>
  </div>
  <main id="chat" class="gut" aria-live="polite"></main>
  <div id="dock" class="gut"></div>
</div>

<section id="panel" class="gut" hidden>
  <div class="pin">
    <div class="ptop">
      <img class="lg-l" src="img/old-light.png" alt="old educação"><img class="lg-d" src="img/old-dark.png" alt="old educação">
      <div style="display:flex;gap:8px">
        <button class="ghost" id="csvBtn" hidden>Baixar planilha (CSV)</button>
        <button class="primary" id="closePanel">Voltar ao formulário</button>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="tDash">Dashboard</button>
      <button role="tab" aria-selected="false" data-tab="tAval">Avaliações</button>
    </div>
    <div id="tDash">
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="dfilters">
          <label for="fReg">Regional<select id="fReg"><option value="">Todas</option></select></label>
          <label for="fFun">Função<select id="fFun"><option value="">Todas</option></select></label>

const FALAS = {

const SIM="Sim, vou avaliar", NAO="Não se aplica";
const STAGES=["Identificação","Experiência","Módulos","Liderança","Finalização"];

/* ================= Helpers ================= */
const $=s=>document.querySelector(s);
const el=(tag,attrs={},...kids)=>{const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==="class")n.className=v;else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)n.setAttribute(k,v===true?"":v);}for(const k of kids.flat())if(k!=null)n.append(k.nodeType?k:document.createTextNode(k));return n;};
const first=n=>(n||"").trim().split(/\s+/)[0]||"";
const digits=s=>(s||"").replace(/\D/g,"");
const fmtPhone=s=>{const d=digits(s).slice(0,11);if(d.length<3)return d;if(d.length<8)return `(${d.slice(0,2)}) ${d.slice(2)}`;return `(${d.slice(0,2)}) ${d.slice(2,d.length-4)}-${d.slice(-4)}`;};
const avg=a=>{const v=(a||[]).filter(x=>typeof x==="number");return v.length?v.reduce((p,q)=>p+q,0)/v.length:null;};
const r2=n=>n==null?null:Math.round(n*100)/100;
const f1=n=>n==null?"—":n.toFixed(1).replace(".",",");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
const liderBlock=a=>({id:"lid",code:"LIDERANÇA",title:`Rotina de liderança · ${a.funcao||""}`,items:(FORM.lideranca[a.funcao]||[]).map(t=>[t,""]),scale:FORM.freq,scaleLabel:"1 nunca · 2 raramente · 3 às vezes · 4 frequentemente · 5 sempre"});

/* ================= Steps ================= */
const STEPS=[
 {id:"lgpd",stage:0,type:"consent",q:()=>FALAS.lgpd},
 {id:"nome",stage:0,type:"text",ph:"Nome completo",check:v=>v.trim().split(/\s+/).length>=2||"Digite nome e sobrenome."},
 {id:"telefone",stage:0,type:"phone",ph:"(00) 00000-0000",q:a=>`Prazer em te conhecer, ${first(a.nome)}! Qual é o seu telefone, com DDD?`,check:v=>[10,11].includes(digits(v).length)||"Informe DDD + número."},
 {id:"email",stage:0,type:"email",ph:"voce@exemplo.com.br",check:v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)||"Esse e-mail parece incompleto."},
 {id:"funcao",stage:0,type:"chips",options:FORM.funcoes},
 {id:"regional",stage:0,type:"chips",options:FORM.regionais},
 {id:"cidade",stage:0,type:"text",ph:"Cidade",q:a=>`Regional ${a.regional}. E em qual cidade você atua?`},
 {id:"empresa",stage:0,type:"chips",options:FORM.empresas},
 {id:"foto",stage:0,type:"photo"},
 {id:"processos",stage:1,type:"multi",options:FORM.modulos.map(m=>m.title)},
 {id:"escala",stage:2,type:"legend"},
 ...FORM.modulos.map(m=>({id:m.id+"_r",stage:2,type:"ratings",module:()=>m,audio:m.id+"_q",when:a=>(a.processos||[]).includes(m.title),q:()=>"Dê sua nota de 1 a 5 para cada atividade:"})),
 {id:"lid_r",stage:3,type:"ratings",module:a=>liderBlock(a),audio:"lideranca",freq:true,q:()=>FALAS.lideranca},

const askText=(s,a)=>s.q?s.q(a):FALAS[s.id];
const audioKey=s=>s.audio||s.id;
const display=(s,v)=>{
  if((v==null||v==="")&&s.type==="ratings")return "Não atuo neste módulo";
  if(v==null||v==="")return "Pular";
  if(s.type==="multi")return v.join(", ");
  if(s.type==="ratings"){const m=s.module(S.a);return `${m.code} · média ${f1(avg(v))}`;}
  if(s.type==="signature")return "Assinatura registrada ✓";
  if(s.type==="photo")return "Foto enviada ✓";
  if(s.type==="legend")return "Entendi";
  if(s.type==="consent")return "Li e concordo ✓";
  return String(v);
};

/* ================= State ================= */
const S={a:{},hist:[],cur:-1,done:false,sound:true,media:{},saveTimer:null};
const DRAFT="lpg-autoavaliacao-rascunho";
const saved=store.get("lpg-som"); if(saved===false) S.sound=false;
$("#voiceBtn").setAttribute("aria-pressed",S.sound);

/* ================= Voice playback ================= */
let ptVoice=null; const player=new Audio(); player.preload="auto";
function pickVoice(){try{const vs=speechSynthesis.getVoices();ptVoice=vs.find(v=>/pt-BR/i.test(v.lang)&&/male|daniel|antonio|google/i.test(v.name))||vs.find(v=>/pt-BR/i.test(v.lang))||null;}catch{}}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
const av=$("#avatar");
player.onplay=()=>av.classList.add("talking");
function stopAll(){const e=S.endCur;S.endCur=null;if(e)e();try{player.pause()}catch{} try{speechSynthesis.cancel()}catch{} const iv=$("#introVideo");try{iv&&iv.pause()}catch{} av.classList.remove("talking");}
function speakKey(key,fallback){
  stopAll(); if(!S.sound) return Promise.resolve();
  return new Promise(done=>{
    let fin=false;const end=()=>{if(!fin){fin=true;if(S.endCur===end)S.endCur=null;done();}};S.endCur=end;setTimeout(end,25000);
    const m=S.media[key];
    const tts=()=>{if(!("speechSynthesis" in window))return end();try{const u=new SpeechSynthesisUtterance(fallback||FALAS[key]||"");u.lang="pt-BR";if(ptVoice)u.voice=ptVoice;u.rate=1.04;u.onstart=()=>av.classList.add("talking");u.onend=u.onerror=()=>{av.classList.remove("talking");end();};speechSynthesis.speak(u);}catch{end();}};
    if(m?.url){player.src=m.url;player.onended=()=>{av.classList.remove("talking");end();};player.onerror=()=>{av.classList.remove("talking");tts();};player.play().catch(end);return;}
    tts();
  });
}
$("#voiceBtn").onclick=()=>{S.sound=!S.sound;$("#voiceBtn").setAttribute("aria-pressed",S.sound);store.set("lpg-som",S.sound);if(!S.sound)stopAll();};

/* ================= Chat ================= */
const chat=$("#chat"),dock=$("#dock");
const scroll=()=>requestAnimationFrame(()=>chat.scrollTop=chat.scrollHeight);
function addBot(html,step,{instant=false}={}){
  return new Promise(res=>{
    const put=()=>{const m=el("div",{class:"msg bot","data-step":step??""});m.innerHTML=html;chat.append(m);scroll();res(m);};
    if(instant)return put();
    const t=el("div",{class:"msg bot typing","data-step":step??""},el("i"),el("i"),el("i"));chat.append(t);scroll();
    setTimeout(()=>{t.remove();put();},Math.min(320+html.length*5,850));
  });
}
function addMe(text,step){const m=el("div",{class:"msg me","data-step":step},text);chat.append(m);scroll();}

function renderProgress(){
  const p=$("#progress");p.innerHTML="";
  const idx=S.cur;const cs=S.done?STAGES.length:(idx<0?-1:STEPS[idx].stage);
  STAGES.forEach((name,i)=>{
    const inS=STEPS.map((s,k)=>[s,k]).filter(([s])=>s.stage===i&&(!s.when||s.when(S.a)));
    let pct=cs>i?100:cs<i?0:Math.round(100*inS.filter(([,k])=>k<idx).length/Math.max(1,inS.length));
    const b=el("b");b.style.width=pct+"%";
    p.append(el("div",{class:"seg"+(cs===i?" on":"")},el("i",{},b),el("small",{},name)));
  });
}

function nextIndex(from){for(let i=from+1;i<STEPS.length;i++){const s=STEPS[i];if(!s.when||s.when(S.a))return i;}return -1;}
async function goTo(i,{instant=false}={}){
  S.cur=i;renderProgress();dock.innerHTML="";
  if(i<0)return finish(instant);
  const s=STEPS[i],text=askText(s,S.a);
  const m=s.module?s.module(S.a):null;
  const head=m&&!s.freq?`<span class="mod-tag">${esc(m.code)}</span><br><b>${esc(m.title)}</b><br>`:m?`<span class="mod-tag">${esc(m.code)}</span><br>`:"";
  await addBot(head+esc(text),s.id,{instant});
  if(!instant)speakKey(audioKey(s));
  renderInput(s);
}
function answer(s,value){
  S.a[s.id]=value;S.hist.push(STEPS.indexOf(s));
  if(!["ratings","signature","photo"].includes(s.type)||(s.type==="ratings"&&value==null))addMe(display(s,value),s.id);
  saveSoon();goTo(nextIndex(STEPS.indexOf(s)));
}
function goBack(){
  if(!S.hist.length)return;stopAll();
  const prev=S.hist.pop();const cur=STEPS[S.cur]?.id;
  chat.querySelectorAll(`[data-step="${STEPS[prev].id}"]`).forEach(n=>n.remove());
  if(cur)chat.querySelectorAll(`[data-step="${cur}"]`).forEach(n=>n.remove());
  goTo(prev,{instant:true});
}
function footer(){const f=el("div",{class:"dockfoot"});const err=el("span",{class:"err",role:"alert"});f.append(err,el("span",{style:"display:flex;gap:14px"},S.hist.length?el("button",{class:"link",onclick:goBack},"← Corrigir a anterior"):null,el("button",{class:"link",onclick:restartAll},"Recomeçar")));return [f,err];}
function restartAll(){S.run=(S.run||0)+1;stopAll();store.del(DRAFT);S.a={};S.hist=[];S.done=false;S.cur=-1;chat.innerHTML="";dock.innerHTML="";intro();}

function renderInput(s){
  dock.innerHTML="";const [foot,err]=footer();
  if(s.type==="chips"){
    const c=el("div",{class:"chips"});s.options.forEach(o=>c.append(el("button",{class:"chip"+(S.a[s.id]===o?" was":""),onclick:()=>answer(s,o)},o)));dock.append(c,foot);
  }else if(s.type==="consent"){
    chat.append(el("div",{class:"card terms","data-step":s.id},el("h3",{},"Termos e condições · LGPD"),el("p",{},FORM.lgpd)));scroll();
    dock.append(el("div",{class:"chips"},el("button",{class:"chip",onclick:()=>answer(s,true)},"Li e concordo")),foot);
  }else if(s.type==="multi"){
    const sel=new Set(S.a[s.id]||[]);const c=el("div",{class:"chips"});
    const ok=el("button",{class:"primary",disabled:!sel.size,onclick:()=>answer(s,s.options.filter(o=>sel.has(o)))},"Confirmar");
    s.options.forEach(o=>{const b=el("button",{class:"chip","aria-pressed":String(sel.has(o))},o);b.onclick=()=>{sel.has(o)?sel.delete(o):sel.add(o);b.setAttribute("aria-pressed",String(sel.has(o)));ok.disabled=!sel.size;};c.append(b);});
    dock.append(c,ok,foot);
  }else if(s.type==="legend"){
    const leg=el("div",{class:"legend"});
    [5,4,3,2,1].forEach(n=>{const bar=el("i");bar.style.width=(n*20)+"%";
      leg.append(el("b",{class:n===5?"top":""},String(n)),el("div",{class:"lv"},el("span",{},FORM.escala[n]),bar),el("small",{},n===5?"Maior nível":n===1?"Menor nível":""));});
    chat.append(el("div",{class:"card","data-step":s.id},el("div",{class:"legcap"},el("span",{},"Escala de conhecimento"),el("span",{},"5 é a nota mais alta")),leg));scroll();
    dock.append(el("div",{class:"chips"},el("button",{class:"chip",onclick:()=>answer(s,true)},"Entendi, vamos lá")),foot);
  }else if(s.type==="ratings"){renderRatings(s,foot);}
  else if(s.type==="signature"){renderSignature(s,foot);}
  else if(s.type==="photo"){renderPhoto(s,foot,err);}
  else{
    const area=s.type==="textarea";

    el("div",{class:"kpi"},el("small",{},"Avaliações"),el("b",{},String(rows.length)),el("span",{},`${done} concluídas`)),
    el("div",{class:"kpi"},el("small",{},"Média técnica"),el("b",{},f1(ag.T)),el("span",{},"conhecimento, de 1 a 5")),
    el("div",{class:"kpi"},el("small",{},"Média liderança"),el("b",{},f1(ag.L)),el("span",{},"frequência, de 1 a 5")),
    el("div",{class:"kpi"},el("small",{},"Regionais"),el("b",{},String(new Set(rows.map(a=>a.regional).filter(Boolean)).size)),el("span",{},"com respostas")),
    el("div",{class:"kpi"},el("small",{},"Empresas"),el("b",{},String(new Set(rows.map(a=>a.empresa).filter(Boolean)).size)),el("span",{},"com respostas"))));
  if(!rows.length){body.append(el("div",{class:"dempty"},"Nenhuma avaliação com esses filtros."));return;}

  const bars=el("div",{class:"bars"});bars.append(el("span"),axis(),el("span"));
  ag.mods.forEach(x=>{const lab=el("div",{class:"blabel"},el("em",{},x.m.code),x.m.title);
    if(!x.n){bars.append(el("div",{class:"brow"},lab,el("div",{class:"na"},"Sem avaliações"),el("span")));return;}
    const html=`<b>${esc(x.m.code)} · ${esc(x.m.title)}</b>Média ${f1(x.M)}<br>${x.n} de ${x.answered||0} atuam no módulo (${pc(x.n,x.answered)})`;
    const tr=bar1(x.M);tr.tabIndex=0;tr.setAttribute("aria-label",`${x.m.code}: média ${f1(x.M)}`);
    tr.onmousemove=e=>showTip(e,html);tr.onmouseleave=hideTip;tr.onfocus=e=>showTip(e,html);tr.onblur=hideTip;
    tr.onclick=()=>{DASH.mod=x.m.id;renderDash();$("#modDetail")?.scrollIntoView({behavior:"smooth",block:"start"});};
    bars.append(el("div",{class:"brow"},lab,tr,el("div",{class:"bvals"},el("span",{},f1(x.M)),el("span",{class:"hint"},`n=${x.n}`))));});
  const c1=el("div",{class:"dcard"},el("h3",{},"Média por módulo técnico"),el("p",{class:"sub"},"Clique em um módulo para ver as atividades."),bars);

  const crit=ag.mods.flatMap(x=>x.items).filter(x=>x.n).sort((a,b)=>a.M-b.M).slice(0,8);
  const ct=el("table",{class:"dtable"},el("thead",{},el("tr",{},el("th",{},"Atividade"),el("th",{},"Média"),el("th",{style:"text-align:right"},"Nota ≤ 2"))),el("tbody",{},...crit.map(x=>el("tr",{},
    el("td",{},el("span",{class:"k"},`${x.m.code} · ${x.i+1}${x.pop?" · "+x.pop:""}`),el("br"),x.name),el("td",{class:"n"},f1(x.M)),el("td",{class:"n",style:"text-align:right"},pc(x.low,x.n))))));
  const c2=el("div",{class:"dcard"},el("h3",{},"Atividades que mais precisam de treinamento"),el("p",{class:"sub"},"Menores médias de conhecimento declarado."),el("div",{class:"tablewrap",style:"border:0"},ct));
  body.append(el("div",{class:"dgrid"},c1,c2));

  const mx=ag.mods.find(x=>x.m.id===DASH.mod)||ag.mods[0];
  const chips=el("div",{class:"modchips"},...ag.mods.map(x=>el("button",{"aria-pressed":String(x.m.id===mx.m.id),onclick:()=>{DASH.mod=x.m.id;renderDash();}},`${x.m.code} · ${x.m.title.split("/")[0]}`)));
  const dt=el("table",{class:"dtable"},el("thead",{},el("tr",{},el("th",{},"#"),el("th",{},"Atividade"),el("th",{},"POP"),el("th",{},"Média"),el("th",{},""),el("th",{},"Nota ≤ 2"))),
    el("tbody",{},...mx.items.map(x=>el("tr",{},el("td",{class:"n"},String(x.i+1).padStart(2,"0")),el("td",{},x.name),el("td",{class:"k"},x.pop||"—"),el("td",{class:"n"},f1(x.M)),
      el("td",{},x.n?el("div",{class:"mini"},bar1(x.M)):el("span",{class:"na"},"—")),
      el("td",{},x.n?(x.low/x.n>=0.3?el("span",{class:"flag"},"⚠ "+pc(x.low,x.n)):el("span",{class:"n"},pc(x.low,x.n))):"—")))));
  body.append(el("div",{class:"dcard",id:"modDetail"},el("h3",{},`${mx.m.code} — ${mx.m.title}`),
    el("p",{class:"sub"},`${mx.n} líder${mx.n===1?"":"es"} avaliaram este módulo · ${pc(mx.n,mx.answered)} atuam nele. ⚠ marca atividades com 30% ou mais de notas até 2.`),chips,el("div",{class:"tablewrap",style:"border:0"},dt)));

  // Liderança por função
  const lcards=FORM.funcoes.filter(f=>!DASH.funcao||DASH.funcao===f).map(f=>{const r=rows.filter(a=>a.funcao===f&&Array.isArray(a.lid_r));
    const lb=el("div",{class:"bars"});lb.append(el("span"),axis(),el("span"));
    FORM.lideranca[f].forEach((t,i)=>{const v=avg(r.map(a=>a.lid_r[i]));lb.append(el("div",{class:"brow"},el("div",{class:"blabel"},el("em",{},String(i+1).padStart(2,"0")),t),r.length?bar1(v,"p"):el("div",{class:"na"},"—"),el("div",{class:"bvals"},el("span",{},f1(v)))));});
    return el("div",{class:"dcard"},el("h3",{},`Liderança · ${f}`),el("p",{class:"sub"},`${r.length} ${r.length===1?"resposta":"respostas"} · média ${f1(avg(r.flatMap(a=>a.lid_r)))} · 1 nunca a 5 sempre`),lb);});
  body.append(...lcards);

  const group=(k,label)=>{const g=[...new Set(rows.map(a=>a[k]).filter(Boolean))].map(u=>{const r=rows.filter(a=>a[k]===u);const x=aggregate(r);return {u,n:r.length,T:x.T,L:x.L};}).sort((a,b)=>b.n-a.n);
    const t=el("table",{class:"dtable"},el("thead",{},el("tr",{},el("th",{},label),el("th",{},"Avaliações"),el("th",{},"Técnica"),el("th",{},"T"),el("th",{},"Liderança"),el("th",{},"L"))),
      el("tbody",{},...g.map(x=>el("tr",{},el("td",{},x.u),el("td",{class:"n"},String(x.n)),el("td",{},x.T!=null?el("div",{class:"mini"},bar1(x.T)):"—"),el("td",{class:"n"},f1(x.T)),el("td",{},x.L!=null?el("div",{class:"mini"},bar1(x.L,"p")):"—"),el("td",{class:"n"},f1(x.L))))));
    return el("div",{class:"dcard"},el("h3",{},"Por "+label.toLowerCase()),el("div",{class:"tablewrap",style:"border:0"},t));};
  body.append(el("div",{class:"dgrid"},group("regional","Regional"),group("empresa","Empresa")));
}
["fReg","fFun","fEmp","fStatus"].forEach(id=>$("#"+id).onchange=()=>{DASH.regional=$("#fReg").value;DASH.funcao=$("#fFun").value;DASH.empresa=$("#fEmp").value;DASH.status=$("#fStatus").value;renderDash();});

welcome();
/* Painel da equipe: abra o site com #painel no final do endereço */
function csvDownload(){const blob=new Blob([csv()],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="autoavaliacao-lider-padrao-goias.csv";document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
async function loadPanel(senha){
  const ep=(window.CONFIG||{}).ENDPOINT||"";
  if(!/^https:\/\/script\.google\.com\//.test(ep))throw new Error("endpoint");
  const r=await fetch(ep+"?senha="+encodeURIComponent(senha)).then(x=>x.json());
  if(!r.ok)throw new Error(r.erro||"erro");
  rowsData=(r.rows||[]).sort((x,y)=>(y.atualizadoEm||"").localeCompare(x.atualizadoEm||""));renderRows();
}
function openPanel(){
  $("#panel").hidden=false;stopAll();
  if(S.panelOk||$("#loginBox"))return;
  const box=el("div",{class:"dcard",id:"loginBox",style:"max-width:420px"},el("h3",{},"Painel da equipe"),el("p",{class:"sub",style:"margin:0"},"Digite a senha do painel para ver as auto avaliações."));
  const inp=el("input",{type:"password",id:"senhaPainel",autocomplete:"current-password",style:"border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--ink)"});
  const err=el("span",{class:"err"});
  const go=el("button",{class:"primary"},"Entrar");
  const demo=el("button",{class:"link",style:"align-self:flex-start",onclick:()=>{DASH.exemplo=true;renderRows();}},"Ver o dashboard com dados de exemplo");
  const submit=async()=>{err.textContent="";go.disabled=true;go.textContent="Carregando…";
    try{await loadPanel(inp.value);S.panelOk=inp.value;box.remove();$("#csvBtn").hidden=false;}
    catch(e){err.textContent=String(e.message)==="senha"?"Senha incorreta.":"Não foi possível carregar. Confira o endereço da planilha em config.js.";}
    go.disabled=false;go.textContent="Entrar";};
  go.onclick=submit;inp.onkeydown=e=>{if(e.key==="Enter")submit();};
  box.append(inp,go,err,demo);$(".tabs").before(box);setTimeout(()=>inp.focus(),50);
}
$("#csvBtn").onclick=csvDownload;
$("#closePanel").onclick=()=>{$("#panel").hidden=true;if(location.hash==="#painel")history.replaceState(null,"",location.pathname);};
if(location.hash==="#painel")openPanel();
window.addEventListener("hashchange",()=>{if(location.hash==="#painel")openPanel();});
